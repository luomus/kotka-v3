<kui-main-content
  pageTitle="Organizations"
  containerClass="container-fluid"
  [fillHeight]="true"
  [hasBottomPadding]="true"
>
  <div class="col-sm-6 mb-2">
    <label for="nameFilter"><strong>Filter by any name field:</strong></label>
    <input
      id="nameFilter"
      type="text"
      class="form-control"
      [(ngModel)]="nameFilterText"
      (ngModelChange)="nameFilterChange()"
    >
  </div>
  <kui-document-datatable
    class="datatable"
    [dataType]="dataType"
    [columns]="columns"
    [defaultFilterModel]="defaultFilterModel"
    [searchQuery]="searchQuery"
    [enableFileExport]="true"
    [enableColumnSelection]="true"
  >
  </kui-document-datatable>
</kui-main-content>
