@if (uri$ | async; as uri) {
  @if (vm$ | async; as vm) {
    <ng-template #headerTemplate>
      <div class="header-layout">
        <div class="header-left-group">
          <h1 data-cy="main-header">
            Accession
            {{ uri }}
          </h1>
          @if (vm.document) {
            <button
              class="btn btn-info"
              (click)="openSpecimenViewer(uri)"
            >
              <i class="fa fa-eye"></i>
            </button>
          }
        </div>
      </div>
    </ng-template>

    <kui-main-content [pageTitle]="uri || ''" [headerTpl]="headerTemplate" containerClass="container" [hasBottomMargin]="true">
      @if (vm.loading) {
        <kui-spinner></kui-spinner>
      } @else if (vm.error) {
        <ngb-alert type="danger" [dismissible]="false">
          {{ vm.error }}
        </ngb-alert>
      } @else if (vm.document) {
        content here
      }
    </kui-main-content>
  }
} @else {
  <kotka-not-found></kotka-not-found>
}
