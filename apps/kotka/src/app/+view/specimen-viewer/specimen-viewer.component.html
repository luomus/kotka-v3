@if (vm$ | async; as vm) {
  <kui-main-content [pageTitle]="uri() || ''" containerClass="container" [hasBottomMargin]="true">
    <kotka-specimen-viewer-header
      kuiMainContentHeader
      class="d-block mb-2"
      [uri]="uri()"
      [specimenDataType]="vm.specimenDataType"
      [document]="vm.document"
      [showEditButton]="!!vm.showEditButton"
    ></kotka-specimen-viewer-header>
    <kotka-specimen-viewer-content
      [loading]="vm.loading"
      [error]="vm.error"
      [fields]="vm.fields"
      [document]="vm.document"
    ></kotka-specimen-viewer-content>
    <kui-document-navigator
      class="bg-white p-2 rounded-2 shadow border"
      [dataType]="dataType"
      [data]="vm.document"
      buttonRouterLink="/view"
    ></kui-document-navigator>
  </kui-main-content>
}
