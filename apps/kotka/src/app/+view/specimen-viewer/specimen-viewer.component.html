@if (vm$ | async; as vm) {
  <kui-main-content [pageTitle]="vm.title || uri()" containerClass="container" [hasBottomPadding]="true">
    <kotka-specimen-viewer-header
      kuiMainContentHeader
      class="d-block mb-2"
      [uri]="uri()"
      [sortId]="sortId()"
      [pageTitle]="vm.title || uri()"
      [specimenDataType]="vm.specimenDataType"
      [document]="vm.document"
      [showEditButton]="!!vm.showEditButton"
    ></kotka-specimen-viewer-header>
    <kotka-specimen-viewer-content
      [loading]="vm.loading"
      [error]="vm.error"
      [fields]="vm.fields"
      [document]="vm.document"
    ></kotka-specimen-viewer-content>
    <kui-document-navigator
      class="bg-white p-2 rounded-2 shadow border"
      [dataType]="dataType"
      [uri]="uri()"
      [sortId]="sortId()"
      buttonRouterLink="/view"
    ></kui-document-navigator>
  </kui-main-content>
}
