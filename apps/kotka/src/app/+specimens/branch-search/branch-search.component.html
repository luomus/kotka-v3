<kui-main-content pageTitle="Branch search" containerClass="container-fluid">
  <kui-document-datatable
    style="height: calc(100vh - 255px)"
    [dataType]="dataType"
    [columns]="columns"
    [enableFileExport]="true"
    [enableColumnSelection]="true"
    [extraSortModel]="[{
      colId: 'id',
      sort:  'desc'
    }]"
  >
  </kui-document-datatable>
</kui-main-content>
