<kui-main-content
  pageTitle="Branch search"
  containerClass="container-fluid"
  [fillHeight]="true"
  [hasBottomPadding]="true"
>
  @if (columns$ | async; as columns) {
    <kui-search
      [fields]="columnsToFields(columns)"
      (search)="onSearch($event)"
    >
    </kui-search>
    <kui-document-datatable
      class="datatable"
      [dataType]="dataType"
      [columns]="columns"
      [enableFileExport]="true"
      [enableColumnSelection]="true"
      [sortModel]="[{
        colId: 'id',
        sort:  'desc'
      }]"
      [searchQuery]="searchQuery"
    >
    </kui-document-datatable>
  }
</kui-main-content>
