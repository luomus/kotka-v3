<div class="form-footer bg-secondary" style="--bs-bg-opacity: 0.75">
  <div class="d-grid gap-2 d-sm-flex">
    @if (hasOnlyWarnings()) {
      <button
        type="button"
        class="btn btn-light col-lg-2 col-sm-3 col-xs-12"
        (click)="highlightErrors.emit()"
      >
        Check the warnings
      </button>
    } @else {
      <button
        class="btn btn-success col-lg-2 col-sm-3 col-xs-12"
        type="submit"
        (click)="saveForm.emit()"
        [disabled]="disabled()"
        data-cy="form-submit"
      >
        Save & keep editing
      </button>
      @if (showCopyButton()) {
        @if (hasChanges()) {
          <button
            class="btn btn-light col-lg-2 col-sm-3 col-xs-12"
            type="submit"
            (click)="saveAndCopyForm.emit()"
            [disabled]="disabled() || hasOnlyWarnings()"
          >
            Save & copy as new
          </button>
        } @else {
          <button
            class="btn btn-light col-lg-2 col-sm-3 col-xs-12"
            type="submit"
            (click)="copyForm.emit()"
            [disabled]="disabled()"
            data-cy="form-copy"
          >
            Copy as new record
          </button>
        }
      }
      @if (showDeleteButton()) {
        <button
          class="btn btn-danger col-lg-1 col-sm-2 col-xs-12"
          type="submit"
          (click)="delete.emit()"
          [disabled]="disabled()"
          data-cy="form-delete"
        >
          Delete
        </button>
      }
    }

    @if (customButtonsTpl(); as tpl) {
      <ng-container *ngTemplateOutlet="tpl"></ng-container>
    }
  </div>
</div>
