<div class="modal-body">
  <h1> {{ title() }}</h1>
  <p>{{ description() }}</p>
  <label class="form-label mb-1 fw-semibold" for="columnSearch">
    {{ searchLabel() }}
  </label>
  <input
    id="columnSearch"
    type="text"
    class="form-control mb-3"
    placeholder="Search..."
    [(ngModel)]="searchText"
  />
  <ag-grid-angular
    id="columnSettingsGrid"
    class="ag-theme-alpine grid"
    [gridOptions]="gridOptions"
    [columnDefs]="gridColDefs"
    [headerHeight]="0"
    [domLayout]="'autoHeight'"
    (gridReady)="onGridReady($event)"
    (rowDragMove)="onRowDragMove($event)"
    (rowDragEnd)="onRowDragEnd()"
    (dragStopped)="onDragStopped()"
    (rowSelected)="onRowSelect($event)"
  ></ag-grid-angular>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-outline-secondary me-auto"
    (click)="resetSettings()"
  >
    Reset settings
  </button>
  <button
    ngbAutofocus
    type="button"
    class="btn btn-primary"
    (click)="onConfirm()"
    data-cy="confirm-ok"
  >
    OK
  </button>
  <button type="button" class="btn btn-outline-secondary" (click)="modal.dismiss()">
    Cancel
  </button>
</div>
